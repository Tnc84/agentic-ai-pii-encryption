[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-pii-encryption"
version = "0.2.0"
description = "LangGraph multi-agent PII pipeline with Presidio, encrypted SQLite/Postgres vault, CLI + API."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agentic-ai-pii-encryption" }]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "httpx>=0.27.0",
  "cryptography>=43.0.0",
  "structlog>=24.4.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "presidio-analyzer>=2.2.0",
  "spacy>=3.7.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "mcp>=1.0.0",
  "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[project.scripts]
pii-pipeline = "cli.main:app"
pii-pipeline-api = "api.app:main"
pii-pipeline-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["cli", "services", "agents", "pii", "crypto", "db", "config", "obs", "prompts", "api", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
